stagesTeaser:
  title: Highline courses
  paragraphs:
    - In 2019, Slack'icîmes became the first association in France to offer highline courses. Since then, the association has introduced more than 450 people to this dizzying sport. It offers courses in different formats, suitable for every level.
    - Discover our different courses.
  illustration:
    image: ../../assets/images/stages/weekend.jpg
    alt: Highliner balancing in front of snowy peaks
festivalTeaser:
  title: Winter FestiSlack
  paragraphs:
    - A one of a kind event combining skiing and highline.
    - It brings together practitioners from all over the world on the fabulous natural site of the Deux Têtes, in the heart of the Les Arcs ski area, facing Mont Blanc.
