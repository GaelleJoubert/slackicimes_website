associationTeaser:
  paragraphs:
    - L'association a été fondée en 2012 et a permis de faire vivre l'activité slackline et highline en Haute Tarentaise en Savoie, notamment à travers l'évènement Winter Festislack, qui rassemble depuis 10 éditions, 150 pratiquants du monde entier, sur le domaine skiable des Arcs, aux Deux Têtes.
    - Nous sommes maintenant deux femmes à la tête de cette association, extrêmement motivées à développer ses nombreuses facettes.
  illustration:
    image: ../../assets/images/association/groupe.jpg
    alt: Groupe de stagiaires et d'encadrantes souriant sur un rocher en montagne
stagesTeaser:
  title: Stages highline
  paragraphs:
    - En 2019, Slack'icîmes est la première association de France à proposer des stages de highline. Depuis ses débuts, l'association a initié plus de 700 personnes à ce sport vertigineux. L'association propose des stages de différents formats, adaptés à tous les niveaux.
  datesNote: Dates 2027 à venir
  illustration:
    image: ../../assets/images/stages/highline-face-a-l-aiguille.jpg
    alt: Deux highlineurs sur une ligne tendue près d'une aiguille rocheuse, au dessus des sapins
festivalTeaser:
  paragraphs:
    - Évènement unique au monde de ski et highline. Il rassemble des pratiquants du monde entier sur le site naturel fabuleux des Deux Têtes, en plein cœur du domaine skiable des Arcs, face au Mont-Blanc.
contactTeaser:
  text: Une question sur un stage, une demande d'initiation ou de démonstration ? Écrivez-nous ou appelez-nous.
