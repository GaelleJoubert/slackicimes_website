stagesTeaser:
  title: Stages Highline
  paragraphs:
    - En 2019, Slack'icîmes est la première association de France à proposer des stages de highline. Depuis ses débuts, l'association a initié plus de 450 personnes à ce sport vertigineux. L'association propose des stages de différents formats, adaptés à tous les niveaux.
    - Découvrez nos différentes formules.
  illustration:
    image: ../../assets/images/stages/weekend.jpg
    alt: Highlineur en équilibre face aux sommets enneigés
festivalTeaser:
  title: Winter FestiSlack
  paragraphs:
    - Évènement unique au monde de ski et highline.
    - Il rassemble des pratiquants du monde entier sur le site naturel fabuleux des Deux Têtes, en plein cœur du domaine skiable des Arcs, face au Mont-Blanc.
