participate:
  eyebrow: Athletes
  title: Get your wild card
  intro: "12 athletes per category: the top 6 of the ISA ranking (after the Poland stop) and 6 video wild cards. If a ranked athlete withdraws, an extra wild card is awarded."
  timeline:
    - { date: "Sept 24, 2026", label: Wild cards open, emphasis: regular }
    - {
        date: "Nov 30, 2026",
        label: Last day to send your video,
        emphasis: highlight,
      }
    - {
        date: December 2026,
        label: Selected wild cards announced,
        emphasis: regular,
      }
  videoFormat:
    title: Video format
    items:
      - Two combos of 7 bounces.
      - The bounce into your first position does not count (rocket start, backbounce…).
      - "Show your control after the 7 bounces: 3 bounces in the final position."
      - "At the start or end of the combo, make the mandatory sign: a triangle with both hands."
  rules:
    title: Rules
    items:
      - No editing within a combo, a single camera angle.
      - No slow motion.
      - Both combos can be in one or two videos.
  judging:
    title: Video judging
    criteria:
      - {
          label: "Difficulty (tier list, a repeated trick drops one tier)",
          points: 40 pts,
        }
      - { label: "Style, control and originality", points: 20 pts / combo }
      - { label: Variety between the two combos, points: 20 pts }
    note: "Why this format? The competition is played only in battles, with many combos: we want athletes who can land them again and again, and variety to avoid repetitive battles."
  submission:
    text: Post your video (Instagram Reel from a public account, public or unlisted YouTube link, or Google Drive link), then fill in the form.
    label: Fill in the wild card form →
    url: "https://forms.gle/LsXL8ETZb51gEKmY6"
  prize:
    title: Prize money · €4,000
    note: Same prize money for women and men.
    places:
      - { label: 1st place, amountInEuros: 900 }
      - { label: 2nd place, amountInEuros: 600 }
      - { label: 3rd place, amountInEuros: 300 }
      - { label: 4th place, amountInEuros: 200 }
  setup:
    title: The setup
    items:
      - "4 parallel lines: two of 74 m, two of 68 m."
      - Dyneema lines rigged on bungees.
      - 100% battle competition.
  rulebook:
    title: Judging rules
    text: The competition's judging rules will be published here as soon as they are final.
organizers:
  eyebrow: The organizers
  title: "Slack'icîmes, highline in Les Arcs since 2013"
  paragraphs:
    - Ten editions of the Winter Festislack, the first highline courses in France, and in 2022, at the Deux Têtes, the first international highline freestyle competition in battle format. In 2023, the ISA upgraded our Master competition to a World Cup.
    - "In 2027, the association is putting all its energy into this World Cup: no Winter Festislack this year, but a spectacular show on the festival's usual dates."
  illustration:
    image: ../../assets/images/world-cup/highliner-salut.jpg
    alt: A highliner waving in the middle of the line, facing snowy peaks
  linkLabel: Discover the association
