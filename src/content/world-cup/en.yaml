event:
  eyebrow: The event
  title: The first stop of the 2027 World Cup
  paragraphs:
    - Highline freestyle is a 2.5 centimeter wide webbing, rigged 25 meters above the ground and stretchy enough to bounce several meters high. Athletes chain rotations, twists and never seen tricks, tied to the line by a safety rope.
    - The ISA World Cup Series is the discipline's first world circuit, launched by the International Slackline Association. In April 2027, it all starts in Les Arcs.
  illustration:
    image: ../../assets/images/world-cup/athlete-rotation.jpg
    alt: An athlete rotating under the line against a blue sky
  stats:
    - { value: "24", label: athletes, detail: "12 women, 12 men" }
    - { value: "4", label: parallel lines, detail: about 70 m long }
    - {
        value: 25 m,
        label: above the snow,
        detail: right in the heart of the resort,
      }
    - {
        value: "€4,000",
        label: in prize money,
        detail: equal for women and men,
      }
  highlights:
    - title: The battle
      text: Two athletes start at the same time on two parallel lines and answer each other trick after trick, like a dance battle. The judges decide.
    - title: Born in Les Arcs
      text: The battle format was created here, at the Deux Têtes, in 2022. It is now used in almost every world competition, World Championships included.
