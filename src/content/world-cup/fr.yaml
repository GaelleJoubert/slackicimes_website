organizers:
  eyebrow: Les organisateurs
  title: "Slack'icîmes, la highline aux Arcs depuis 2013"
  paragraphs:
    - Dix éditions du Winter Festislack, les premiers stages de highline en France, et en 2022, aux Deux Têtes, la première compétition internationale de highline freestyle au format battle. En 2023, notre compétition Master a été requalifiée en World Cup par l'ISA.
    - "En 2027, l'association met toute son énergie dans cette Coupe du Monde : pas de Winter Festislack cette année, mais un spectacle grandiose aux dates habituelles du festival."
  illustration:
    image: ../../assets/images/world-cup/highliner-figure-sommet.jpg
    alt: Un highliner en pleine figure au-dessus de la ligne, devant un sommet enneigé
  linkLabel: "Découvrir l'association"
