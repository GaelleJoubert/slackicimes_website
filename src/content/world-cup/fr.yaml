event:
  eyebrow: "L'événement"
  title: Coupe du Monde 2027 – Première étape
  paragraphs:
    - "La highline est une variante du funambulisme moderne, sur une sangle de 2,5 centimètres, élastique, tendue en hauteur. La highline freestyle, c'est la discipline acrobatique de la « highline ». Les athlètes enchaînent rotations, vrilles et figures spectaculaires, toujours reliés à la ligne pour leur sécurité."
    - "Les ISA World Cup Series sont le premier circuit mondial de la discipline, lancé par l'International Slackline Association (ISA). L'édition des Arcs est la première de la saison 2027."
  illustration:
    image: ../../assets/images/world-cup/athlete-rotation.jpg
    alt: Une athlète en rotation sous la ligne, sur fond de ciel bleu
  stats:
    - { value: "24", label: athlètes, detail: "12 femmes, 12 hommes" }
    - { value: "4", label: lignes parallèles, detail: "d'environ 70 m de long" }
    - {
        value: 25 m,
        label: au-dessus de la neige,
        detail: en plein cœur de la station,
      }
    - {
        value: 4 000 €,
        label: de prize money,
        detail: identique femmes et hommes,
      }
format:
  title: Format & Origines
  battle:
    title: La battle
    text: Deux athlètes s'élancent en même temps sur deux lignes parallèles et se répondent figure après figure, comme une battle de danse. Les juges tranchent.
  origin:
    title: Né aux Arcs
    text: "Le format battle a été créé ici, aux Deux Têtes, en 2022. Il est aujourd'hui celui de presque toutes les compétitions mondiales, Championnats du monde compris."
  bracket:
    title: Comment se joue la compétition ?
    pool:
      title: Poules de 4
      text: Chaque athlète y décroche son rang, de 1er à 4e.
      ranks: [1er, 2e, 3e, 4e]
    grandFinal:
      title: Demi-finales et grande finale
      text: Les 1ers de poule s'affrontent jusqu'au titre.
    rankFinals:
      title: Demi-finales et petites finales
      text: Les 2es, 3es et 4es de poule jouent chacun le tableau de leur rang.
