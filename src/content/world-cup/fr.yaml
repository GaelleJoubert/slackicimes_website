athletes:
  eyebrow: Athlètes
  title: Informations pour les athlètes
  intro: "12 athlètes par catégorie : les 6 premiers du classement ISA (après l'étape de Pologne) et 6 wild cards sur vidéo. Si un athlète du classement se désiste, une wild card supplémentaire est attribuée."
  contest:
    title: La compétition
    setup:
      title: Le setup
      items:
        - "4 lignes parallèles : deux de 74 m, deux de 68 m."
        - Lignes en Dyneema montées sur bungees.
        - Compétition 100 % battle.
    prize:
      title: Prize money · 4 000 €
      note: Même dotation pour les femmes et pour les hommes.
      places:
        - { label: 1re place, amountInEuros: 900 }
        - { label: 2e place, amountInEuros: 600 }
        - { label: 3e place, amountInEuros: 300 }
        - { label: 4e place, amountInEuros: 200 }
    rulebook:
      title: Règlement de jugement
      text: "Le règlement de jugement de la compétition sera publié ici dès qu'il sera finalisé."
  wildCard:
    title: Décroche ta wild card
    timeline:
      - {
          date: 24 sept. 2026,
          label: Ouverture des wild cards,
          emphasis: regular,
        }
      - {
          date: 30 nov. 2026,
          label: Dernier jour pour envoyer ta vidéo,
          emphasis: highlight,
        }
      - {
          date: Décembre 2026,
          label: Annonce des wild cards retenues,
          emphasis: regular,
        }
    videoFormat:
      title: Format de la vidéo
      items:
        - Deux combos de 7 rebonds.
        - Le rebond pour entrer dans ta première position ne compte pas (départ en rocket, backbounce…).
        - "Montre ton contrôle après les 7 rebonds : 3 rebonds en position finale."
        - "Au début ou à la fin du combo, fais le signe obligatoire : un triangle avec les deux mains."
    rules:
      title: Règles
      items:
        - Aucun montage dans le combo, un seul angle de vue.
        - Pas de ralenti.
        - Les deux combos peuvent être dans une ou deux vidéos.
    judging:
      title: Jugement des vidéos
      criteria:
        - {
            label: "Difficulté (tier list, une figure répétée descend d'un tier)",
            points: 40 pts,
          }
        - { label: "Style, contrôle et originalité", points: 20 pts / combo }
        - { label: Variété entre les deux combos, points: 20 pts }
      note: "Pourquoi ce format ? La compétition se joue uniquement en battle, avec beaucoup de combos : on veut voir des athlètes capables de les replaquer, et de la diversité pour éviter les battles répétitives."
    submission:
      text: Poste ta vidéo (Reel Instagram d'un compte public, lien YouTube public ou privé, ou lien Google Drive), puis remplis le formulaire.
      formLabel: Remplir le formulaire wild card
      formUrl: "https://forms.gle/LsXL8ETZb51gEKmY6"
      rulesLabel: "Règlement détaillé (PDF, en anglais)"
      rulesUrl: "https://drive.google.com/file/d/10DoaADau1BqLYGdcwkwOagzmTuyD5Nr6/view"
