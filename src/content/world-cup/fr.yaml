event:
  eyebrow: "L'événement"
  title: La première étape de la Coupe du Monde 2027
  paragraphs:
    - La highline freestyle, c'est une sangle large de 2,5 centimètres, tendue à 25 mètres du sol et assez élastique pour y faire des rebonds de plusieurs mètres. Les athlètes y enchaînent rotations, vrilles et figures inédites, reliés à la ligne par une corde de sécurité.
    - Les ISA World Cup Series sont le premier circuit mondial de la discipline, lancé par l'International Slackline Association. En avril 2027, c'est aux Arcs que tout commence.
  illustration:
    image: ../../assets/images/world-cup/athlete-rotation.jpg
    alt: Une athlète en rotation sous la ligne, sur fond de ciel bleu
  stats:
    - { value: "24", label: athlètes, detail: "12 femmes, 12 hommes" }
    - { value: "4", label: lignes parallèles, detail: "d'environ 70 m de long" }
    - {
        value: 25 m,
        label: au-dessus de la neige,
        detail: en plein cœur de la station,
      }
    - {
        value: 4 000 €,
        label: de prize money,
        detail: identique femmes et hommes,
      }
  highlights:
    - title: La battle
      text: Deux athlètes s'élancent en même temps sur deux lignes parallèles et se répondent figure après figure, comme une battle de danse. Les juges tranchent.
    - title: Né aux Arcs
      text: "Le format battle a été créé ici, aux Deux Têtes, en 2022. Il est aujourd'hui celui de presque toutes les compétitions mondiales, Championnats du monde compris."
