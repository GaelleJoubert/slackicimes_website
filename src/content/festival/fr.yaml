announcement:
  eyebrow: Édition 2027 ?
  title: En 2027, place à la Coupe du Monde
  paragraphs:
    - En 2027 l'association se concentre sur l'organisation de la Coupe du Monde de Highline Freestyle ! Pas de Winter Festislack cette année.
    - Cependant le spectacle sera grandiose, et aux dates habituelles du festival. Nous vous donnons donc rendez-vous sur la place principale d'Arc 2000 du 14 au 16 avril 2027 !
  poster:
    image: ../../assets/images/festival/affiche-coupe-du-monde-2027.jpg
    alt: "Affiche de la Coupe du Monde de Highline Freestyle des Arcs, du 14 au 16 avril 2027, place Olympique à Arc 2000 : des highlineurs en figures aériennes au dessus de la station"
