announcement:
  title: 2027 edition?
  paragraphs:
    - In 2027 the association is focusing on organizing the Highline Freestyle World Cup! There will be no Winter Festislack this year.
    - The show will still be spectacular, on the festival's usual dates. See you on the main square of Arc 2000 from April 14 to 16, 2027!
  poster:
    image: ../../assets/images/festival/affiche-coupe-du-monde-2027.jpg
    alt: "Poster of the Les Arcs Highline Freestyle World Cup, April 14 to 16, 2027, Place Olympique in Arc 2000: highliners performing aerial tricks above the resort"
